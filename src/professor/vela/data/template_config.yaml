model:
  pytorch:
    name: Fourier series
    checkpoints:
          - 0024.pt
    devices:
          - 0
    seed: 1231
    dimensions:
      n_inputs: 4
      batch_size: 1
      y_pixels: 512
      x_pixels: 512
    invocation:
      target: professor.torch_models.Generator
      params:
        input_size: ${model.pytorch.dimensions.n_inputs}
        im_size: ${model.pytorch.dimensions.x_pixels}
        num_channels: 1
        max_features: 1024
        min_features: 128
        first_layer:
          invocation:
            target: torch.nn.Identity
        last_layer:
          invocation:
            target: professor.layers.AlphaLinear
            params:
              n_channels: ${model.pytorch.invocation.params.num_channels}
        act_fun: "ReLU"
        y_kernel: 4
        x_kernel: 4
        last_bias: False
    execution:
      half_precision: True
      jit: False

gui:
  napari:
    fields:
      - prediction
    sliders:
      parameter_0:
        lower_bound: -1
        upper_bound: 1
        initial_value: 0
