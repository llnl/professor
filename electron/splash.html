<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' file: data:;"
    />
    <title>Professor Dash GUI</title>
    <style>
      html,
      body {
        margin: 0;
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: transparent;
        scrollbar-width: none;
      }

      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <img src="professor_logo.png" alt="Professor" />
  </body>
</html>
